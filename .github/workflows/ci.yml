name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopsphere
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shopsphere
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U shopsphere"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The scripts read ../../.env; build it from throw-away CI values (nothing here is a real secret).
      - name: Create .env
        run: |
          cat > .env <<ENV
          NODE_ENV=development
          DATABASE_URL=postgresql://shopsphere:ci-only-password@localhost:5433/shopsphere
          TEST_DATABASE_URL=postgresql://shopsphere:ci-only-password@localhost:5433/shopsphere_test
          CORS_ORIGIN=http://localhost:5173
          JWT_ACCESS_SECRET=ci-access-secret-ci-access-secret-0123
          JWT_REFRESH_SECRET=ci-refresh-secret-ci-refresh-secret-01
          SEED_ADMIN_EMAIL=admin@shopsphere.demo
          SEED_ADMIN_PASSWORD=CiAdminPass2026
          ENV

      - run: pnpm install --frozen-lockfile
      - name: Security audit (high and above)
        run: pnpm audit --audit-level=high
      - run: pnpm --filter @shopsphere/api prisma:generate

      - name: Create and migrate databases
        run: |
          PGPASSWORD=ci-only-password psql -h localhost -p 5433 -U shopsphere -d shopsphere -f scripts/db-init.sql
          pnpm --filter @shopsphere/api prisma:deploy
          DATABASE_URL=postgresql://shopsphere:ci-only-password@localhost:5433/shopsphere_test pnpm --filter @shopsphere/api prisma:deploy
          pnpm db:seed
          DATABASE_URL=postgresql://shopsphere:ci-only-password@localhost:5433/shopsphere_test pnpm db:seed
          pnpm --filter @shopsphere/api demo:seed

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: End-to-end and accessibility tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
